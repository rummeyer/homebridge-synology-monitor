<!--
  Settings page shown inside the Homebridge UI, as Appliance Monitor's.

  Runs in an iframe the host provides; `homebridge.*` is injected by it. The
  host supplies Bootstrap and the active theme, so styling stays minimal.

  The settings are this page's own form (settings.js): one NAS at a time,
  picked from a list, and General with the link to the dashboard under its
  switch. Homebridge's generated form is kept hidden.
-->
<script src="settings.js"></script>

<div class="card mb-3">
  <div class="card-body" id="sm-settings"></div>
</div>

<script>
  (async () => {
    homebridge.hideSchemaForm();
    const style = document.createElement('style');
    style.textContent = window.SynologySettings.css;
    document.head.append(style);
    const address = await homebridge.request('/address').catch(() => null);
    await window.SynologySettings.mount(document.getElementById('sm-settings'), { homebridge, address });
  })();
</script>
